<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>开源游戏与开发工具分类合集</title>
    <meta
      name="description"
      content="开源游戏、引擎框架、Three.js 3D 游戏、微信小游戏、美术工具与商业源码精选合集，支持全站搜索与分类浏览。"
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* 主题预置：避免首帧闪烁（与 ui.js 的 og:theme 约定一致） */
      (function () {
        try {
          var t = localStorage.getItem('og:theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <!-- 顶部滚动进度条 -->
    <div class="og-progress" id="og-progress" aria-hidden="true"></div>

    <!-- 顶部 Header -->
    <header class="og-header">
      <button id="og-menu-btn" class="og-icon-btn og-menu-btn" type="button" aria-label="打开导航" aria-expanded="false">
        <svg class="og-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>

      <a class="og-brand" href="#top" aria-label="回到顶部">
        <span class="og-brand-icon" aria-hidden="true">
          <svg class="og-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/></svg>
        </span>
        <span class="og-brand-text">开源游戏合集</span>
      </a>

      <!-- 全站搜索 -->
      <div class="og-search" id="og-search">
        <span class="og-search-icon" aria-hidden="true">
          <svg class="og-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input
          id="og-search-input"
          class="og-search-input"
          type="search"
          placeholder="搜索游戏 / 引擎 / 工具…"
          autocomplete="off"
          spellcheck="false"
          aria-label="全站搜索"
          role="combobox"
          aria-expanded="false"
          aria-controls="og-search-panel"
          aria-autocomplete="list"
        />
        <button id="og-search-clear" class="og-search-clear" type="button" aria-label="清空搜索" hidden>
          <svg class="og-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <span class="og-search-kbd" aria-hidden="true">Ctrl K</span>
        <div id="og-search-panel" class="og-search-panel" role="listbox" aria-label="搜索结果" hidden></div>
        <div id="og-search-status" class="og-sr-only" role="status" aria-live="polite"></div>
      </div>

      <button id="og-theme-btn" class="og-icon-btn" type="button" aria-label="切换明暗主题">
        <svg id="og-theme-icon" class="og-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
      </button>
    </header>

    <!-- 遮罩层（移动端抽屉） -->
    <div id="og-overlay" class="og-overlay" hidden></div>

    <!-- 左侧分类导航 -->
    <aside class="og-sidebar" id="og-sidebar" aria-label="分类导航">
      <nav id="og-sidebar-nav" class="og-side-nav"><!-- render.js 填充 --></nav>
    </aside>

    <!-- 主内容区 -->
    <main class="og-main" id="og-main" tabindex="-1">
      <div class="og-loading" id="og-loading">
        <div class="og-loading-spinner" aria-hidden="true"></div>
        <p>正在加载合集数据…</p>
        <noscript><p>本站需要启用 JavaScript 才能浏览与搜索。</p></noscript>
      </div>
    </main>

    <footer class="og-footer">
      <p>数据整理自《开源游戏与开发工具分类合集》 · 仅供学习交流，使用前请遵循各项目许可证</p>
      <p class="og-footer-meta">纯静态站点 · 支持暗色模式 · <kbd>/</kbd> 或 <kbd>Ctrl+K</kbd> 唤起搜索</p>
    </footer>

    <!-- 返回顶部 -->
    <button id="og-backtop" class="og-backtop" type="button" aria-label="返回顶部" hidden>
      <svg class="og-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
    </button>
  </body>
</html>
